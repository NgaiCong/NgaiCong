<svg fill="none" viewBox="0 0 800 200" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
 <foreignObject width="100%" height="100%">
  <div xmlns="http://www.w3.org/1999/xhtml">
   <style>
    .wrapper {
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d1117; /* Màu nền tối (GitHub Dark) */
      border-radius: 10px;
    }
    .text {
      font-family: 'Segoe UI', Ubuntu, Sans-Serif; /* Font hiện đại hơn */
      font-size: 3.5em;
      font-weight: 800;
      background: linear-gradient(to right, #00dbde, #fc00ff); /* Gradient Cyan -> Purple */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      
      /* Hiệu ứng gõ máy */
      white-space: nowrap;
      overflow: hidden;
      border-right: 4px solid #fc00ff;
      width: 0;
      animation: typing 3s steps(30, end) forwards, blink 0.7s infinite;
      
      /* Hiệu ứng phát sáng */
      filter: drop-shadow(0 0 10px rgba(252, 0, 255, 0.5));
    }
    /* Animation gõ chữ rồi giữ nguyên */
    @keyframes typing {
      from { width: 0 }
      to { width: 18ch } /* Độ rộng vừa đủ tên bạn */
    }
    @keyframes blink {
      50% { border-color: transparent }
    }
   </style>
   <div class="wrapper">
     <div class="text">
       NGUYỄN THÀNH CÔNG
     </div>
   </div>
  </div>
 </foreignObject>
</svg>
