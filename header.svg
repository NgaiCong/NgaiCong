<svg fill="none" viewBox="0 0 800 200" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
 <foreignObject width="100%" height="100%">
  <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .wrapper {
          height: 200px; /* Đặt chiều cao khớp với SVG */
          display: grid;
          place-items: center;
          background-color: transparent; /* Nền trong suốt */
        }

        .text {
          /* "Nguyễn Thành Công" dài 17 ký tự */
          width: 17ch; 
          animation: typing 2.5s steps(17), blink .5s step-end infinite alternate;
          white-space: nowrap;
          overflow: hidden;
          border-right: 3px solid;
          font-family: monospace;
          font-size: 3em; /* Điều chỉnh size chữ cho vừa khung */
          font-weight: bold;
          
          /* Vibe Biển Xanh: Từ xanh đậm đại dương sang xanh ngọc */
          background: linear-gradient(90deg, #0062ff 0%, #00dbde 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          border-color: #00dbde; /* Màu con trỏ nhấp nháy trùng với màu đuôi gradient */
        }

        @keyframes typing {
          from { width: 0 }
        }

        @keyframes blink {
          50% { border-color: transparent }
        }
      </style>
      <div class="wrapper">
        <div class="text">
          Nguyễn Thành Công
        </div>
      </div>
  </div>
 </foreignObject>
</svg>
