<svg fill="none" viewBox="0 0 800 200" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .wrapper {
          height: 200px;
          display: grid;
          place-items: center;
          background-color: transparent;
        }
        .text {
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          font-size: 3em;
          font-weight: 800;
          letter-spacing: -0.5px;
          border-right: 3px solid #00dbde;
          padding-right: 0px; 
          box-sizing: border-box;
          background: linear-gradient(90deg, #0062ff 0%, #00dbde 50%, #0062ff 100%);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          white-space: nowrap;
          overflow: hidden;
          width: 0;
          animation: typing 3s ease-out forwards, blink 0.5s step-end infinite alternate, shimmer 3s linear infinite;
        }
        @keyframes typing {
          from { width: 0 }
          to { width: 11.8em } 
        }
        @keyframes blink {
          50% { border-color: transparent }
        }
        @keyframes shimmer {
          to { background-position: 200% center }
        }
      </style>
      <div class="wrapper">
        <div class="text">
          NGUYỄN THÀNH CÔNG
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
