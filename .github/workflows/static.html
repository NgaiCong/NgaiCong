<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ôn thi cho Thúii ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FF8FAB;
            --primary-dark: #FB6F92;
            --bg: #FFF0F3;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .safe-area-top {
            padding-top: env(safe-area-inset-top);
        }

        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }

        .screen {
            position: absolute;
            inset: 0;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .btn-tap:active {
            transform: scale(0.96);
        }

        .custom-scroll::-webkit-scrollbar {
            display: none;
        }

        .keyword-highlight {
            background-color: #FFE0B2;
            color: #E65100;
            font-weight: 800;
            border-bottom: 2px solid #FF9800;
            padding: 0 2px;
            border-radius: 4px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>

<body>

    <div id="root" class="h-full relative overflow-hidden">
        <!-- HOME SCREEN -->
        <div id="home" class="screen active safe-area-top">
            <div class="p-8 text-center">
                <h1 class="text-4xl font-black text-[#FB6F92] tracking-tighter drop-shadow-sm">Ôn thi cho Thúii ❤️</h1>
                <p class="text-gray-400 font-bold text-[10px] uppercase tracking-[0.2em] mt-2 italic"></p>
            </div>
            <div class="flex-1 overflow-y-auto px-6 pb-20 custom-scroll">
                <div class="grid gap-4">
                    <button onclick="startQuiz('all')"
                        class="btn-tap bg-gradient-to-br from-[#FF8FAB] to-[#FB6F92] p-8 rounded-[2.5rem] shadow-xl text-white text-left relative overflow-hidden border-b-8 border-pink-700/20">
                        <div class="relative z-10">
                            <h3 class="font-black text-2xl">ÔN TỔNG HỢP</h3>
                            <p class="text-xs font-bold opacity-80 uppercase">Random 100+ câu hỏi & Đề lẻ</p>
                        </div>
                        <span class="absolute -right-4 -bottom-4 text-8xl opacity-20">🔥</span>
                    </button>

                    <div id="chapter-list" class="grid gap-3">
                        <!-- Chapters injected by JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- THEORY SCREEN -->
        <div id="theory" class="screen bg-white">
            <header
                class="safe-area-top bg-white/90 backdrop-blur-md border-b px-6 py-4 flex items-center justify-between sticky top-0 z-20">
                <button onclick="goHome()"
                    class="w-10 h-10 flex items-center justify-center bg-gray-50 rounded-xl text-xl active:scale-90 transition-transform">🏡</button>
                <h2 id="theory-title"
                    class="font-black text-[#FB6F92] text-sm uppercase tracking-tighter text-center flex-1 mx-4">Lý
                    thuyết</h2>
                <div class="w-10"></div>
            </header>
            <div class="flex-1 overflow-y-auto p-6 custom-scroll pb-20" id="theory-content">
                <!-- Theory injected by JS -->
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz" class="screen bg-white">
            <header
                class="safe-area-top bg-white/80 backdrop-blur-md border-b px-6 py-4 flex items-center justify-between sticky top-0 z-20">
                <button onclick="goHome()"
                    class="w-10 h-10 flex items-center justify-center bg-gray-50 rounded-xl text-xl active:scale-90 transition-transform">🏡</button>
                <div class="text-center">
                    <h2 id="quiz-title" class="font-black text-[#FB6F92] text-sm uppercase tracking-tighter">Chương 1
                    </h2>
                    <div class="text-[10px] text-gray-300 font-bold"><span id="curr-idx">1</span> / <span
                            id="total-idx">0</span></div>
                </div>
                <div class="w-10"></div>
            </header>

            <div class="w-full h-1.5 bg-gray-100">
                <div id="progress-bar"
                    class="h-full bg-gradient-to-r from-pink-300 to-[#FB6F92] transition-all duration-500 rounded-r-full"
                    style="width: 0%"></div>
            </div>

            <div class="flex-1 overflow-y-auto p-6 custom-scroll pb-32" id="quiz-body">
                <!-- Question card -->
                <div
                    class="bg-white p-8 rounded-[2.5rem] shadow-2xl shadow-pink-100 border-b-8 border-pink-50 relative mb-6">
                    <button onclick="toggleHint()" id="hint-btn"
                        class="absolute -top-4 right-8 bg-[#FF9800] text-white px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg active:scale-90 transition-all">💡
                        Gợi ý</button>
                    <p id="q-text" class="text-xl font-black text-gray-800 leading-snug"></p>
                    <div id="hint-box"
                        class="hidden mt-6 p-5 bg-[#FFF3E0] text-[#E65100] text-xs font-bold rounded-2xl border-l-8 border-[#FF9800] animate-in shadow-inner">
                    </div>
                </div>

                <div id="options-grid" class="space-y-3"></div>

                <div id="explanation-card" class="hidden mt-8 space-y-4 animate-in">
                    <div class="bg-blue-50 p-6 rounded-[2rem] border-t-8 border-blue-200">
                        <h4
                            class="text-blue-600 font-black text-[10px] uppercase tracking-widest mb-2 flex items-center gap-2">
                            <span>✅</span> Vì sao đúng?
                        </h4>
                        <p id="exp-text" class="text-blue-900 font-bold text-sm leading-relaxed"></p>
                    </div>
                    <div class="bg-red-50 p-6 rounded-[2rem] border-t-8 border-red-200">
                        <h4
                            class="text-red-400 font-black text-[10px] uppercase tracking-widest mb-2 flex items-center gap-2">
                            <span>❌</span> Tại sao câu kia sai?
                        </h4>
                        <p id="dist-text" class="text-red-900 italic font-bold text-xs leading-relaxed opacity-70"></p>
                    </div>
                </div>
            </div>

            <footer
                class="safe-area-bottom absolute bottom-0 inset-x-0 p-6 bg-white/95 backdrop-blur-lg flex gap-4 shadow-[0_-10px_40px_rgba(255,143,171,0.15)]">
                <button onclick="prevQ()" id="prev-btn"
                    class="w-16 h-16 bg-gray-50 rounded-3xl flex items-center justify-center text-2xl active:scale-75 transition-transform disabled:opacity-20 border-2 border-gray-100">⬅️</button>
                <button onclick="nextQ()" id="next-btn"
                    class="flex-1 bg-gradient-to-r from-[#FF8FAB] to-[#FB6F92] text-white font-black text-lg rounded-3xl shadow-xl active:scale-95 transition-all border-b-4 border-pink-700/20">TIẾP
                    TỤC ➜</button>
            </footer>
        </div>
    </div>

    <script>
        // --- DỮ LIỆU LÝ THUYẾT ---
        const theoryData = {
            'Chương 1': { title: 'Bản chất Tâm lý người', summary: 'Tâm lý là sự phản ánh TG khách quan vào não qua lăng kính chủ thể. Bản chất: Xã hội - Lịch sử. Phân loại: Quá trình (ngắn), Trạng thái (vừa), Thuộc tính (ổn định).' },
            'Chương 2': { title: 'Hoạt động & Giao tiếp', summary: 'Hoạt động: Quan hệ 2 chiều giữa Chủ thể và Khách thể (Xuất tâm & Nhập tâm). Giao tiếp: Tiếp xúc tâm lý người-người để trao đổi tin, cảm xúc.' },
            'Chương 3': { title: 'Ý thức', summary: 'Cấp độ: Vô thức (bản năng), Ý thức, Tự ý thức (biết mình), Ý thức nhóm (tập thể).' },
            'Chương 4': { title: 'Nhận thức', summary: 'Cảm giác (riêng lẻ), Tri giác (trọn vẹn). Tư duy (bản chất), Tưởng tượng (hình ảnh mới). Quy luật: Thích ứng, Tương phản, Tổng giác.' },
            'Chương 5': { title: 'Tình cảm', summary: 'Thái độ ổn định. Quy luật: Thích ứng (quen), Di chuyển (trút giận), Lây lan (vui lây), Pha trộn (giận thương), Cảm ứng (tương phản).' },
            'Chương 6': { title: 'Ý chí & Kỹ xảo', summary: 'Ý chí: vượt khó. Kỹ xảo: tự động hóa do tập luyện. Thói quen: tự động hóa do nhu cầu/đạo đức.' },
            'Chương 7': { title: 'Nhân cách', summary: 'Tổ hợp ổn định. Xu hướng (động cơ), Khí chất (thần kinh), Tính cách (thái độ), Năng lực (thành công).' },
            'Đề Thùy Dương': { title: 'Đề ôn tập Thùy Dương', summary: 'Trắc nghiệm tổng quát kiến thức từ Chương 1 đến Chương 7 với các câu hỏi bám sát giáo trình.' },
            'Đề Hải Đăng': { title: 'Đề ôn tập Hải Đăng', summary: 'Bộ đề 70 câu hỏi bao quát toàn bộ chương trình Tâm lý học đại cương, tập trung vào bản chất và quy luật.' },
            'Đề Lẻ': { title: 'Tổng hợp đề nâng cao', summary: 'Các câu hỏi từ đề Hải Đăng, Thùy Dương tập trung vào quy luật cảm giác, tri giác và các tình huống thực tế khó.' }
        };

        // --- DỮ LIỆU CÂU HỎI (Trích xuất đầy đủ từ PDF Tâm lý học đại cương) ---
        const db = [
            // ========== CHƯƠNG 1: NHẬP MÔN TÂM LÝ HỌC ==========
            { c: "Chương 1", q: "Tình huống nào [không phải là hiện tượng tâm lý]?", a: ["Lan nhớ về kỷ niệm", "Hạnh nghe giảng", "Trời mưa làm My ướt", "Hưng năng động"], r: 2, h: "Tìm hiện tượng [Vật lý/Tự nhiên] tác động bên ngoài.", e: "Trời mưa ướt là hiện tượng vật lý, không phải do não bộ điều khiển.", d: "Nhớ, chú ý, tính cách đều là hiện tượng tâm lý rõ rệt." },
            { c: "Chương 1", q: "Mẹ [trò chuyện] với bào thai liên quan bản chất nào?", a: ["Lịch sử công cộng", "Lịch sử cá nhân", "Bản chất xã hội", "Tất cả đúng"], r: 2, h: "Giao tiếp là mầm mống của [Xã hội].", e: "Tâm lý người hình thành qua giao tiếp xã hội ngay từ trong bụng mẹ.", d: "Lịch sử thường nói về thời đại; trò chuyện nhấn mạnh vào tương tác xã hội." },
            { c: "Chương 1", q: "Tâm lý người có [nguồn gốc] từ đâu?", a: ["Não người", "Thế giới khách quan", "Hoạt động cá nhân", "Quan hệ xã hội"], r: 1, h: "Phản ánh cái gì [từ bên ngoài] vào não?", e: "Thế giới khách quan cung cấp nội dung để não bộ phản ánh.", d: "Não là cơ quan thực hiện, không phải nguồn gốc nội dung." },
            { c: "Chương 1", q: "[Đối tượng] của tâm lý học là gì?", a: ["Các quá trình, trạng thái, thuộc tính tâm lý", "Sự vận động vật chất", "Thế giới xã hội", "Bản năng con người"], r: 0, h: "Tâm lý học nghiên cứu [quy luật tinh thần].", e: "Đối tượng là các hiện tượng tâm lý (quá trình, trạng thái, thuộc tính).", d: "Vật chất thuộc vật lý; xã hội thuộc xã hội học." },
            { c: "Chương 1", q: "Hiện tượng tâm lý có thời gian [ngắn nhất], có mở đầu diễn biến kết thúc rõ ràng là?", a: ["Quá trình tâm lý", "Trạng thái tâm lý", "Thuộc tính tâm lý", "Cả A và B"], r: 0, h: "Thời gian diễn ra [ngắn nhất] trong 3 loại.", e: "Quá trình tâm lý (như cảm giác, tư duy) diễn ra nhanh và rõ ràng.", d: "Trạng thái kéo dài hơn; Thuộc tính là ổn định khó thay đổi." },
            { c: "Chương 1", q: "Tâm lý người mang tính [chủ thể] vì sao?", a: ["Mỗi người có lăng kính riêng", "Cùng 1 vật nhưng mỗi người thấy khác", "Do kinh nghiệm sống khác nhau", "Tất cả đều đúng"], r: 3, h: "Con người không phải [cái máy] sao chụp y hệt.", e: "Tính chủ thể do sự khác biệt về não bộ, hoàn cảnh và kinh nghiệm sống.", d: "A, B, C đều là các khía cạnh của tính chủ thể." },
            { c: "Chương 1", q: "Tâm lý là kết quả của sự [phản ánh] hiện thực khách quan vào não?", a: ["Đúng", "Sai"], r: 0, h: "Não là [tấm gương] đặc biệt.", e: "Tâm lý không tự nhiên có mà là kết quả của sự tác động thế giới vào não.", d: "Nếu không có thế giới tác động, não không thể nảy sinh tâm lý." },
            { c: "Chương 1", q: "Căn cứ bản chất [Xã hội - Lịch sử], giáo viên cần chú ý điều gì?", a: ["Dạy giống hệt nhau cho mọi học sinh", "Tìm hiểu văn hóa vùng miền, hoàn cảnh sống", "Chỉ quan tâm đến điểm số", "Không cần quan tâm môi trường"], r: 1, h: "Môi trường [Sống & Văn hóa] tạo nên tâm hồn.", e: "Tâm lý hình thành từ các quan hệ xã hội và điều kiện lịch sử cụ thể.", d: "Bỏ qua môi trường là sai lầm trong giáo dục tâm lý." },
            { c: "Chương 1", q: "Sự kiện nào [đánh dấu] tâm lý học trở thành khoa học độc lập?", a: ["Wundt mở phòng thí nghiệm (1879)", "Aristotle viết sách", "Pavlov thí nghiệm chó", "Freud tìm ra vô thức"], r: 0, h: "Năm [1879] tại Leipzig (Đức).", e: "Phòng thí nghiệm của Wundt đưa tâm lý học thoát khỏi triết học.", d: "Các sự kiện kia quan trọng nhưng không phải dấu mốc độc lập." },
            { c: "Chương 1", q: "Chức năng của tâm lý là gì?", a: ["Định hướng hành động", "Điều khiển, kiểm soát", "Điều chỉnh hành vi", "Tất cả đúng"], r: 3, h: "Tâm lý là [kim chỉ nam] cho mọi việc làm.", e: "Tâm lý giúp con người định hướng, điều khiển và điều chỉnh hành động.", d: "Thiếu một trong các chức năng này con người sẽ hoạt động mù quáng." },
            { c: "Chương 1", q: "Tâm lý người là sản phẩm của [hoạt động] và [giao tiếp]?", a: ["Đúng", "Sai"], r: 0, h: "Con người [làm việc] và [nói chuyện] để phát triển.", e: "Hoạt động và giao tiếp là 2 con đường hình thành tâm lý người.", d: "Không có hoạt động và giao tiếp, tâm lý không thể phát triển." },
            { c: "Chương 1", q: "[Não] đóng vai trò gì trong sự hình thành tâm lý?", a: ["Nguồn gốc của tâm lý", "Cơ quan phản ánh", "Nội dung tâm lý", "Cả A và C"], r: 1, h: "Não là [công cụ] để phản ánh.", e: "Não là cơ quan vật chất thực hiện chức năng phản ánh tâm lý.", d: "Nguồn gốc là thế giới khách quan, không phải não." },
            { c: "Chương 1", q: "Phản ánh tâm lý khác phản ánh [sinh lý] ở chỗ nào?", a: ["Mang tính chủ thể", "Có tính sáng tạo", "Phản ánh bản chất", "Tất cả đúng"], r: 3, h: "Phản ánh tâm lý [sáng tạo] hơn phản ánh cơ học.", e: "Phản ánh tâm lý mang tính chủ thể, sáng tạo và khái quát.", d: "Phản ánh sinh lý chỉ là phản ứng cơ học, máy móc." },
            { c: "Chương 1", q: "[Trạng thái tâm lý] là gì?", a: ["Hiện tượng tâm lý kéo dài vừa phải", "Nền tảng cho hoạt động tâm lý", "Như chú ý, tâm trạng", "Tất cả đúng"], r: 3, h: "Trạng thái là [nền] cho các quá trình diễn ra.", e: "Trạng thái tâm lý như tâm trạng, chú ý làm nền cho hoạt động.", d: "Quá trình diễn ra nhanh; Thuộc tính ổn định lâu dài." },
            { c: "Chương 1", q: "[Thuộc tính tâm lý] có đặc điểm gì?", a: ["Ổn định, bền vững", "Khó thay đổi", "Đặc trưng cho cá nhân", "Tất cả đúng"], r: 3, h: "Thuộc tính là [nét tính cách] ổn định.", e: "Thuộc tính như tính cách, năng lực, xu hướng rất khó thay đổi.", d: "Quá trình ngắn; Trạng thái vừa phải; Thuộc tính lâu dài." },
            { c: "Chương 1", q: "Tại sao nói tâm lý người mang bản chất [xã hội]?", a: ["Hình thành qua quan hệ xã hội", "Chịu ảnh hưởng văn hóa", "Thay đổi theo lịch sử", "Tất cả đúng"], r: 3, h: "Con người [sống trong xã hội].", e: "Tâm lý người được hình thành và phát triển trong môi trường xã hội.", d: "Tâm lý động vật chỉ mang tính bản năng, không có tính xã hội." },
            { c: "Chương 1", q: "Phương pháp [quan sát] trong tâm lý học là gì?", a: ["Tri giác có mục đích hành vi", "Đặt câu hỏi cho đối tượng", "Tạo tình huống thử nghiệm", "Phân tích sản phẩm"], r: 0, h: "[Nhìn] và ghi chép hành vi.", e: "Quan sát là theo dõi hành vi tự nhiên để thu thập dữ liệu.", d: "Câu hỏi là phỏng vấn; Thử nghiệm là thực nghiệm." },
            { c: "Chương 1", q: "Phương pháp [thực nghiệm] trong tâm lý học có đặc điểm gì?", a: ["Tạo điều kiện để gây ra hiện tượng", "Chủ động thay đổi biến số", "Có thể lặp lại nhiều lần", "Tất cả đúng"], r: 3, h: "[Tạo tình huống] để nghiên cứu.", e: "Thực nghiệm cho phép kiểm soát và lặp lại điều kiện.", d: "Quan sát chỉ theo dõi tự nhiên, không can thiệp." },

            // ========== CHƯƠNG 2: HOẠT ĐỘNG VÀ GIAO TIẾP ==========

        ];

        // --- LOGIC ỨNG DỤNG ---
        let currentList = [];
        let currentIdx = 0;
        let history = {};
        let isHintActive = false;

        // Khởi tạo danh sách chương
        function initChapters() {
            const grid = document.getElementById('chapter-list');
            const chapters = ['Chương 1', 'Chương 2', 'Chương 3', 'Chương 4', 'Chương 5', 'Chương 6', 'Chương 7', 'Đề Thùy Dương', 'Đề Hải Đăng', 'Đề Lẻ'];

            chapters.forEach(c => {
                const container = document.createElement('div');
                container.className = "bg-white p-5 rounded-[2rem] shadow-sm border border-pink-50 flex justify-between items-center group animate-in";

                const info = document.createElement('div');
                info.className = "flex-1";
                info.innerHTML = `
                <h3 class="font-black text-[#4A4A4A] text-lg">${c}</h3>
                <div class="flex gap-2 mt-2">
                    <button onclick="viewTheory('${c}')" class="text-[10px] bg-indigo-50 text-indigo-600 px-4 py-1.5 rounded-full font-black uppercase active:bg-indigo-100">Lý thuyết</button>
                    <button onclick="startQuiz('${c}')" class="text-[10px] bg-pink-50 text-[#FB6F92] px-4 py-1.5 rounded-full font-black uppercase active:bg-pink-100">Luyện đề</button>
                </div>
            `;

                const icon = document.createElement('div');
                icon.className = "bg-pink-50 w-12 h-12 rounded-full flex items-center justify-center text-2xl";
                icon.innerText = getChapterIcon(c);

                container.appendChild(info);
                container.appendChild(icon);
                grid.appendChild(container);
            });
        }

        function getChapterIcon(c) {
            if (c.includes('1')) return '🧠';
            if (c.includes('2')) return '🗣️';
            if (c.includes('3')) return '💡';
            if (c.includes('4')) return '👀';
            if (c.includes('5')) return '❤️';
            if (c.includes('6')) return '✊';
            if (c.includes('7')) return '👤';
            return '📚';
        }

        // --- ĐIỀU HƯỚNG ---
        function goHome() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('home').classList.add('active');
        }

        function viewTheory(c) {
            const data = theoryData[c];
            const questionsOfChap = db.filter(q => q.c === c);

            document.getElementById('theory-title').innerText = c;
            const content = document.getElementById('theory-content');
            content.innerHTML = `
            <div class="bg-indigo-50 p-8 rounded-[3rem] border-l-[12px] border-indigo-400 shadow-inner mb-10">
                <h3 class="font-black text-indigo-800 mb-4 text-lg uppercase flex items-center gap-2"><span>📖</span> Tóm tắt trọng tâm</h3>
                <p class="text-indigo-900 leading-relaxed font-bold italic">${data.summary}</p>
            </div>
            <h3 class="font-black text-2xl text-gray-800 mb-6 flex items-center gap-2"><span>❓</span> Xem trước câu hỏi (${questionsOfChap.length})</h3>
            <div class="space-y-4">
                ${questionsOfChap.map((q, i) => `
                    <div class="bg-[#FFF0F3] p-6 rounded-[2.5rem] border border-pink-100 shadow-sm">
                        <p class="font-black text-gray-800 text-sm mb-4">${i + 1}. ${q.q.replace(/\[|\]/g, '')}</p>
                        <div class="bg-white p-4 rounded-2xl border border-pink-50">
                            <p class="text-[10px] font-black text-green-600 uppercase mb-1">Đáp án đúng:</p>
                            <p class="font-bold text-gray-700 text-sm">${q.a[q.r]}</p>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('theory').classList.add('active');
            content.scrollTop = 0;
        }

        function startQuiz(filter) {
            // Lọc và TRỘN NGẪU NHIÊN
            if (filter === 'all') {
                currentList = [...db].sort(() => Math.random() - 0.5);
            } else {
                currentList = db.filter(i => i.c === filter).sort(() => Math.random() - 0.5);
            }

            if (currentList.length === 0) { alert('Chưa có câu hỏi cho phần này!'); return; }

            currentIdx = 0;
            history = {};
            isHintActive = false;
            document.getElementById('quiz-title').innerText = filter === 'all' ? 'Tổng Hợp' : filter;
            document.getElementById('total-idx').innerText = currentList.length;

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('quiz').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            const item = currentList[currentIdx];
            const hasAnswered = history[currentIdx] !== undefined;

            document.getElementById('curr-idx').innerText = currentIdx + 1;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / currentList.length) * 100}%`;
            document.getElementById('q-text').innerHTML = formatText(item.q, isHintActive);

            const hintBox = document.getElementById('hint-box');
            hintBox.innerHTML = `✨ Gợi ý cho Thúii: ${item.h}`;
            hintBox.classList.toggle('hidden', !isHintActive);

            const hintBtn = document.getElementById('hint-btn');
            hintBtn.className = isHintActive ? "absolute -top-4 right-8 bg-[#E65100] text-white px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg scale-110" : "absolute -top-4 right-8 bg-[#FF9800] text-white px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg";

            const explCard = document.getElementById('explanation-card');
            explCard.classList.toggle('hidden', !hasAnswered);
            if (hasAnswered) {
                document.getElementById('exp-text').innerText = item.e;
                document.getElementById('dist-text').innerText = item.d;
            }

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            item.a.forEach((txt, i) => {
                const btn = document.createElement('button');
                const isCorrect = i === item.r;
                const isSelected = history[currentIdx] === i;

                let btnStyle = "bg-white border-gray-100 text-gray-700 shadow-md";
                if (hasAnswered) {
                    if (isCorrect) btnStyle = "bg-green-500 border-green-600 text-white shadow-green-200 scale-105 z-10";
                    else if (isSelected) btnStyle = "bg-red-500 border-red-600 text-white opacity-90";
                    else btnStyle = "bg-white border-transparent text-gray-200 opacity-40 grayscale";
                } else {
                    btnStyle += " active:bg-pink-50 active:border-pink-200";
                }

                btn.className = `w-full p-6 text-left rounded-[2rem] border-2 font-black transition-all flex items-center justify-between text-lg ${btnStyle}`;
                btn.disabled = hasAnswered;
                btn.onclick = () => selectOption(i);

                let icon = '';
                if (hasAnswered) {
                    if (isCorrect) icon = '<span class="text-2xl ml-2">✅</span>';
                    else if (isSelected) icon = '<span class="text-2xl ml-2">❌</span>';
                }

                btn.innerHTML = `<span class="flex-1">${txt}</span> ${icon}`;
                grid.appendChild(btn);
            });

            document.getElementById('prev-btn').disabled = currentIdx === 0;
            const nextBtn = document.getElementById('next-btn');
            if (!hasAnswered) {
                nextBtn.innerText = "CHỌN 1 ĐÁP ÁN...";
                nextBtn.classList.add('opacity-50', 'pointer-events-none');
            } else {
                nextBtn.innerText = (currentIdx === currentList.length - 1) ? "HOÀN THÀNH ❤️" : "TIẾP TỤC ➜";
                nextBtn.classList.remove('opacity-50', 'pointer-events-none');
            }
        }

        function formatText(text, show) {
            return text.replace(/\[(.*?)\]/g, (match, p1) => {
                return show ? `<span class="keyword-highlight">${p1}</span>` : `<span class="font-black">${p1}</span>`;
            });
        }

        function selectOption(i) {
            history[currentIdx] = i;
            if (typeof window.navigator.vibrate === 'function') window.navigator.vibrate(10);
            loadQuestion();
            setTimeout(() => {
                document.getElementById('quiz-body').scrollTo({ top: 1000, behavior: 'smooth' });
            }, 300);
        }

        function toggleHint() {
            isHintActive = !isHintActive;
            loadQuestion();
        }

        function nextQ() {
            if (currentIdx < currentList.length - 1) {
                currentIdx++;
                isHintActive = false;
                loadQuestion();
                document.getElementById('quiz-body').scrollTop = 0;
            } else {
                alert("Chúc mừng Thúii ❤️ đã hoàn thành xuất sắc bộ câu hỏi này!");
                goHome();
            }
        }

        function prevQ() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
                document.getElementById('quiz-body').scrollTop = 0;
            }
        }

        // Khởi chạy
        initChapters();
    </script>
</body>

</html>
